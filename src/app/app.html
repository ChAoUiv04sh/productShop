<div class="container mt-4">
  <!-- Header -->
  <div class="header mb-4">
    <h1>{{ 'ProductsShop' }}</h1>
    <div class="stats">
      <p>Nombre de produits: {{ products.length | number }}</p>
      <p>Total panier: {{ cartTotal | currency:'EUR':'symbol':'1.2-2' }}</p>
      <p>Date: {{ today | date:'dd/MM/yyyy' }}</p>
    </div>
  </div>

  <!-- Product Filter Component -->
  <app-product-filter 
    (filtersChanged)="updateFilters($event)"
  />

  <!-- Product List Component -->
  <app-product-list 
    [products]="filteredProducts" 
    [selectedId]="selectedProduct?.id ?? null"
    (productSelected)="onProductSelected($event)"
    (addedToCart)="onAddToCart($event)"
  />

  <!-- Debug section -->
  <pre class="debug mt-4 p-3 bg-light border rounded">
    {{ selectedProduct | json }}
  </pre>
</div>
