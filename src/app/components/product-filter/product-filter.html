<div class="filter-card card mb-4">
  <div class="card-body">
    <h5 class="card-title mb-3">Filtrer les produits</h5>
    
    <div class="row g-3">
      <!-- Search input -->
      <div class="col-md-4">
        <label class="form-label">Recherche</label>
        <input 
          type="text" 
          class="form-control"
          [class.search-active]="searchText"
          [style.borderColor]="searchText ? '#22c55e' : '#d1d5db'"
          [(ngModel)]="searchText"
          (ngModelChange)="applyFilters()"
          placeholder="Nom ou marque..."
        >
      </div>

      <!-- Category select -->
      <div class="col-md-3">
        <label class="form-label">Catégorie</label>
        <select 
          class="form-select"
          [(ngModel)]="selectedCategory"
          (ngModelChange)="applyFilters()"
        >
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat | titlecase }}</option>
          }
        </select>
      </div>

      <!-- Price range -->
      <div class="col-md-3">
        <label class="form-label">Prix max: {{ maxPrice | currency:'EUR' }}</label>
        <input 
          type="range" 
          class="form-range"
          [(ngModel)]="maxPrice"
          (ngModelChange)="applyFilters()"
          min="0" 
          max="2000" 
          step="50"
        >
        <div class="price-range-values">
          <span>0 €</span>
          <span>2000 €</span>
        </div>
      </div>

      <!-- Reset button -->
      <div class="col-md-2 d-flex align-items-end">
        <button 
          class="btn btn-secondary w-100"
          (click)="resetFilters()"
          [disabled]="isFormEmpty"
        >
          Réinitialiser
        </button>
      </div>
    </div>
  </div>
</div>
