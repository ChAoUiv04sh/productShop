<div class="products-grid">
  @for (product of products; track product.id) {
    <div class="product-item" [class.selected]="product.id === selectedId">
      <app-product-card 
        [product]="product"
        (productClick)="onProductSelected($event)"
        (addToCart)="onAddToCart($event)"
      />
    </div>
  } @empty {
    <div class="empty-state">
      <i class="bi bi-inbox display-1"></i>
      <p class="mt-3">Aucun produit correspond à votre recherche.</p>
    </div>
  }
</div>
